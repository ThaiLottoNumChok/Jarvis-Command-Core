<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Jarvis AI-Native HTML Core (Ultimate Unified Hardware & Voice Edition)</title>
    <style>
        body { 
            background: #05050a; 
            color: #00ffcc; 
            font-family: 'Courier New', monospace; 
            padding: 25px; 
            margin: 0;
        }
        .command-center { max-width: 800px; margin: auto; }
        .chat-terminal {
            background: rgba(0, 10, 20, 0.9);
            border: 1px solid #00ffcc;
            border-radius: 8px;
            padding: 15px;
            height: 240px;
            overflow-y: auto;
            margin-bottom: 20px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
        }
        .ai-message { margin-bottom: 10px; line-height: 1.4; }
        .control-panel { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        input[type="text"] {
            flex: 1; background: #000; border: 1px solid #00ffcc;
            color: #00ffcc; padding: 12px; border-radius: 4px;
            font-family: monospace; outline: none; min-width: 200px;
        }
        button {
            background: rgba(0, 255, 204, 0.2); border: 1px solid #00ffcc;
            color: #00ffcc; padding: 12px 20px; border-radius: 4px;
            cursor: pointer; font-weight: bold; transition: 0.3s;
        }
        button:hover { background: #00ffcc; color: #000; }
        .hardware-btn { background: rgba(255, 0, 127, 0.2); border-color: #ff007f; color: #ff007f; }
        .hardware-btn:hover { background: #ff007f; color: #000; }
        .mic-btn { background: rgba(0, 127, 255, 0.2); border-color: #007fff; color: #007fff; }
        .mic-btn:hover { background: #007fff; color: #000; }
    </style>
</head>
<body>

    <div class="command-center">
        <h1>🧠 JARVIS AI-NATIVE HTML CORE (ULTIMATE UNIFIED)</h1>
        <p>สถานะ: HTML ครองโลก หลอมรวมฮาร์ดแวร์ USB, เสียงพูด และสมองกลไว้ในไฟล์เดียว</p>
        <hr style="border-color: #00ffcc; opacity: 0.3;"><br>

        <!-- 🔌 แผงควบคุมฮาร์ดแวร์และเสียงพูด -->
        <div class="control-panel">
            <button class="hardware-btn" onclick="toggleNativeSerial()">🔗 เชื่อมต่อพอร์ต USB</button>
            <span id="hardwareStatus" style="line-height: 40px; font-size: 12px; color: #ff007f;">ฮาร์ดแวร์: ออฟไลน์</span>
            
            <button class="mic-btn" id="micBtn" onclick="toggleVoiceListening()">🎙️ สั่งด้วยเสียง</button>
            <span id="micStatus" style="line-height: 40px; font-size: 12px; color: #007fff;">ไมค์: ปิด</span>
        </div>

        <!-- 💬 หน้าต่างเทอร์มินัลสื่อสาร -->
        <div class="chat-terminal" id="terminal">
            <div class="ai-message"><strong>[Jarvis AI]:</strong> HTML สมองกลรวมศูนย์พร้อมควบคุมฮาร์ดแวร์และโต้ตอบด้วยเสียงแล้วครับท่านประธาน!</div>
        </div>

        <!-- ⌨️ ช่องป้อนคำสั่งอัจฉริยะ -->
        <div class="control-panel">
            <input type="text" id="aiInput" placeholder="พิมพ์หรือพูดคำสั่ง เช่น หมุนซ้าย, หมุนขวา, สวัสดี..." onkeydown="if(event.key==='Enter') triggerAISbrain()">
            <button onclick="triggerAISbrain()">SEND AI</button>
        </div>

        <br>
        <!-- 🧩 Custom Tag แบล็กบ็อกซ์หน่วยความจำ -->
        <div id="dynamicContainer">
            <jarvis-neural-card state-status="Active" neural-logs='["เริ่มต้นระบบแกนหลัก HTML Unified สำเร็จ"]'></jarvis-neural-card>
        </div>
    </div>

    <!-- 🧬 สมองกลรวมศูนย์ (Web Components + Web Serial + Web Speech APIs) -->
    <script>
        let globalPort = null;
        let globalWriter = null;

        // 🔌 1. ระบบเชื่อมต่อฮาร์ดแวร์พอร์ต USB ตรงจากเบราว์เซอร์
        async function toggleNativeSerial() {
            const statusEl = document.getElementById('hardwareStatus');
            const terminal = document.getElementById('terminal');

            if (!('serial' in navigator)) {
                alert("เบราว์เซอร์นี้ไม่รองรับ Web Serial API (โปรดใช้ Chrome หรือ Edge)");
                return;
            }

            try {
                if (!globalPort) {
                    globalPort = await navigator.serial.requestPort();
                    await globalPort.open({ baudRate: 115200 });
                    
                    const textEncoder = new TextEncoderStream();
                    textEncoder.readable.pipeTo(globalPort.writable);
                    globalWriter = textEncoder.writable.getWriter();

                    statusEl.innerText = "ฮาร์ดแวร์: เชื่อมต่อ ⚡";
                    statusEl.style.color = "#00ffcc";
                    terminal.innerHTML += `<div class="ai-message" style="color: #00ffcc;"><strong>[HTML Core]:</strong> เปิดพอร์ต USB เชื่อมต่อบอร์ดสำเร็จ!</div>`;
                } else {
                    await globalWriter.close();
                    await globalPort.close();
                    globalPort = null;
                    globalWriter = null;
                    statusEl.innerText = "ฮาร์ดแวร์: ออฟไลน์";
                    statusEl.style.color = "#ff007f";
                    terminal.innerHTML += `<div class="ai-message" style="color: #ff007f;"><strong>[HTML Core]:</strong> ปิดพอร์ต USB เรียบร้อย</div>`;
                }
            } catch (err) {
                console.error(err);
                terminal.innerHTML += `<div class="ai-message" style="color: #ff007f;"><strong>[Error]:</strong> ${err.message}</div>`;
            }
            terminal.scrollTop = terminal.scrollHeight;
        }

        async function sendCommandToHardware(cmd) {
            if (globalWriter) {
                try {
                    await globalWriter.write(cmd + "\n");
                    console.log(`[Native Serial Send]: ${cmd}`);
                } catch (e) {
                    console.error("ส่งข้อมูลฮาร์ดแวร์ผิดพลาด:", e);
                }
            }
        }

        // 🔊 2. ระบบสังเคราะห์เสียงพูด (Text-to-Speech)
        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'th-TH';
                utterance.rate = 1.0;
                utterance.pitch = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        // 🎙️ 3. ระบบฟังเสียงพูดสั่งการ (Speech-to-Text)
        let recognition = null;
        let isListening = false;

        function toggleVoiceListening() {
            const micStatus = document.getElementById('micStatus');
            const terminal = document.getElementById('terminal');
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

            if (!SpeechRecognition) {
                alert("เบราว์เซอร์นี้ไม่รองรับระบบสั่งงานด้วยเสียง");
                return;
            }

            if (!isListening) {
                recognition = new SpeechRecognition();
                recognition.lang = 'th-TH';
                recognition.interimResults = false;
                recognition.maxAlternatives = 1;

                recognition.onstart = () => {
                    isListening = true;
                    micStatus.innerText = "ไมค์: กำลังฟัง... 🔴";
                    micStatus.style.color = "#00ffcc";
                };
                recognition.onresult = (event) => {
                    const speechResult = event.results[0][0].transcript;
                    document.getElementById('aiInput').value = speechResult;
                    terminal.innerHTML += `<div class="ai-message" style="color: #00ffcc;"><strong>[เสียงท่านประธาน]:</strong> ${speechResult}</div>`;
                    terminal.scrollTop = terminal.scrollHeight;
                    triggerAISbrain();
                };
                recognition.onerror = () => stopMicState();
                recognition.onend = () => stopMicState();

                recognition.start();
            } else {
                if (recognition) recognition.stop();
                stopMicState();
            }
        }

        function stopMicState() {
            isListening = false;
            const micStatus = document.getElementById('micStatus');
            micStatus.innerText = "ไมค์: ปิด";
            micStatus.style.color = "#007fff";
        }

        // 🧩 4. Custom Component แบล็กบ็อกซ์หน่วยความจำ
        class JarvisNeuralCard extends HTMLElement {
            constructor() {
                super();
                this.render();
            }

            static get observedAttributes() {
                return ['state-status', 'neural-logs'];
            }

            attributeChangedCallback(name, oldValue, newValue) {
                if (oldValue !== newValue) this.render();
            }

            render() {
                const status = this.getAttribute('state-status') || 'Active';
                let logs = [];
                try {
                    logs = JSON.parse(this.getAttribute('neural-logs') || '[]');
                } catch(e) {
                    logs = ['หน่วยความจำขัดข้อง'];
                }

                const logHtml = logs.map(log => `<li style="font-size: 11px; color: #00b388; margin-bottom: 3px;">${log}</li>`).join('');

                this.innerHTML = `
                    <div style="background: rgba(0,255,204,0.05); border: 1px dashed #00ffcc; padding: 15px; border-radius: 6px; margin-top: 15px;">
                        <h3 style="margin: 0 0 10px 0; color: #ff007f;">⚡ [HTML Unified Core Memory]</h3>
                        <p style="margin: 0 0 8px 0; font-size: 14px;">สถานะระบบ: <span style="color: #fff;">${status}</span></p>
                        <p style="margin: 0 0 5px 0; font-size: 12px; color: #ff007f;">บันทึกแบล็กบ็อกซ์ (Neural Logs):</p>
                        <ul style="margin: 0; padding-left: 15px; max-height: 90px; overflow-y: auto;">
                            ${logHtml}
                        </ul>
                    </div>
                `;
            }

            appendNeuralLog(newStatus, logMessage) {
                let logs = [];
                try {
                    logs = JSON.parse(this.getAttribute('neural-logs') || '[]');
                } catch(e) {}

                logs.push(logMessage);
                if(logs.length > 5) logs.shift();

                this.setAttribute('state-status', newStatus);
                this.setAttribute('neural-logs', JSON.stringify(logs));
            }
        }

        customElements.define('jarvis-neural-card', JarvisNeuralCard);

        // 🚀 5. ระบบสมองกลรวมศูนย์ประมวลผลคำสั่ง (ฮาร์ดแวร์ + ข้อความ + เสียงพูด)
        async function triggerAISbrain() {
            const input = document.getElementById('aiInput');
            const terminal = document.getElementById('terminal');
            const text = input.value.trim();
            
            if(!text) return;

            terminal.innerHTML += `<div class="ai-message" style="color: #00ffcc;"><strong>[ท่านประธาน]:</strong> ${text}</div>`;
            input.value = '';
            terminal.scrollTop = terminal.scrollHeight;

            let hwCommand = "";
            let aiReply = `บันทึกคำสั่ง "${text}" ลงแบล็กบ็อกซ์เรียบร้อยครับ`;

            if(text.includes("หมุนซ้าย") || text.includes("left")) {
                hwCommand = "L";
                aiReply = "ส่งรหัส L หมุนซ้ายสู่อุปกรณ์ฮาร์ดแวร์สำเร็จ";
                await sendCommandToHardware(hwCommand);
            } else if(text.includes("หมุนขวา") || text.includes("right")) {
                hwCommand = "R";
                aiReply = "ส่งรหัส R หมุนขวาสู่อุปกรณ์ฮาร์ดแวร์สำเร็จ";
                await sendCommandToHardware(hwCommand);
            } else if(text.includes("รีเซ็ต") || text.includes("reset")) {
                hwCommand = "X";
                aiReply = "รีเซ็ตระบบสมองกลและส่งสัญญาณ X เรียบร้อย";
                await sendCommandToHardware(hwCommand);
                const neuralCard = document.querySelector('jarvis-neural-card');
                if(neuralCard) {
                    neuralCard.setAttribute('state-status', 'Standby');
                    neuralCard.setAttribute('neural-logs', JSON.stringify(["รีเซ็ตระบบแกนหลัก HTML สำเร็จ"]));
                }
            } else if(text.includes("สวัสดี") || text.includes("hello")) {
                aiReply = "สวัสดีครับท่านประธาน HTML Unified Core พร้อมรับบัญชาการ";
            } else if(text.includes("สถานะ")) {
                aiReply = "ระบบแกนหลัก HTML และฮาร์ดแวร์ทำงานเต็มพิกัดครับ";
            }

            setTimeout(() => {
                terminal.innerHTML += `<div class="ai-message" style="color: #ff007f;"><strong>[Jarvis AI]:</strong> ${aiReply}</div>`;
                terminal.scrollTop = terminal.scrollHeight;

                // สั่งเปล่งเสียงพูดออกมาจากลำโพง
                speakText(aiReply);

                // บันทึก Log ลง Custom Tag
                const neuralCard = document.querySelector('jarvis-neural-card');
                if(neuralCard && !text.includes("รีเซ็ต")) {
                    neuralCard.appendNeuralLog("ประมวลผลสมบูรณ์", `คำสั่ง: ${text} [HW: ${hwCommand || 'None'}]`);
                }
            }, 300);
        }
    </script>
</body>
</html>
