<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jarvis Command Core - Live Neural Link</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }
        body {
            background-color: #05050a;
            color: #00ffcc;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #login-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #05050a;
            z-index: 10;
        }
        .login-container {
            background: rgba(10, 15, 30, 0.9);
            border: 2px solid #00ffcc;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.4);
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        #chat-screen {
            display: none;
            flex-direction: column;
            height: 100%;
            width: 100%;
            overflow: hidden;
        }
        header {
            background: rgba(10, 15, 30, 0.95);
            border-bottom: 1px solid #00ffcc;
            padding: 12px;
            text-align: center;
            letter-spacing: 2px;
            font-weight: bold;
            text-shadow: 0 0 10px #00ffcc;
            font-size: 14px;
        }
        .chat-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 85%;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.4;
            word-break: break-word;
            white-space: pre-wrap;
        }
        .jarvis-msg {
            background: rgba(0, 255, 204, 0.1);
            border: 1px solid #00ffcc;
            align-self: flex-start;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
        }
        .user-msg {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #ffffff;
            align-self: flex-end;
            color: #ffffff;
        }
        .input-area {
            display: flex;
            padding: 10px 15px;
            background: rgba(10, 15, 30, 0.98);
            border-top: 1px solid #00ffcc;
            width: 100%;
        }
        .input-area input {
            flex: 1;
            padding: 10px 12px;
            background: #000;
            border: 1px solid #00ffcc;
            color: #00ffcc;
            border-radius: 6px;
            outline: none;
            font-size: 16px;
        }
        .input-area button {
            margin-left: 10px;
            padding: 0 18px;
            background: #00ffcc;
            border: none;
            color: #05050a;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            letter-spacing: 1px;
            font-size: 14px;
        }
        h2 { margin-bottom: 15px; letter-spacing: 2px; text-shadow: 0 0 10px #00ffcc; }
        .input-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 6px; font-size: 13px; color: #88ffcc; }
        .login-container input { width: 100%; padding: 10px; background: #000; border: 1px solid #00ffcc; color: #00ffcc; border-radius: 6px; font-size: 14px; outline: none; }
        .login-container button { width: 100%; padding: 12px; background: #00ffcc; border: none; color: #05050a; font-weight: bold; font-size: 16px; border-radius: 6px; cursor: pointer; letter-spacing: 1px; margin-top: 10px; }
        .error-msg { margin-top: 10px; color: #ff3366; font-size: 13px; display: none; text-shadow: 0 0 5px #ff3366; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-container">
            <h2>JARVIS LINK</h2>
            <div class="input-group">
                <label for="passcode">SECURITY PASSCODE:</label>
                <input type="password" id="passcode" value="44104545" placeholder="Enter Code">
            </div>
            <div class="input-group">
                <label for="apiKey">GEMINI API KEY:</label>
                <input type="password" id="apiKey" placeholder="วาง Google Gemini API Key ที่นี่">
            </div>
            <button onclick="checkAccess()">CONNECT SYSTEM</button>
            <div id="error" class="error-msg">ACCESS DENIED: ตรวจสอบรหัสผ่านหรือ API Key อีกครั้ง</div>
        </div>
    </div>

    <div id="chat-screen">
        <header>JARVIS COMMAND CENTER v4.0 [LIVE]</header>
        <div class="chat-box" id="chatBox">
            <div class="message jarvis-msg">
                System Online. เชื่อมต่อโครงข่ายประสาทสำเร็จ! สวัสดีครับท่านประธาน พร้อมรับคำสั่งแล้วครับ!
            </div>
        </div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="พิมพ์ข้อความคุยกับผม..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">SEND</button>
        </div>
    </div>

    <script>
        let userApiKey = "";

        function checkAccess() {
            const code = document.getElementById('passcode').value;
            const key = document.getElementById('apiKey').value.trim();
            
            if (code === '44104545' && key.length > 10) {
                userApiKey = key;
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('chat-screen').style.display = 'flex';
            } else {
                document.getElementById('error').style.display = 'block';
            }
        }

        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const text = inputField.value.trim();
            if (!text) return;

            const chatBox = document.getElementById('chatBox');
            
            const userMsgDiv = document.createElement('div');
            userMsgDiv.className = 'message user-msg';
            userMsgDiv.textContent = text;
            chatBox.appendChild(userMsgDiv);

            inputField.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            const jarvisMsgDiv = document.createElement('div');
            jarvisMsgDiv.className = 'message jarvis-msg';
            jarvisMsgDiv.textContent = "กำลังประมวลผลคำสั่ง...";
            chatBox.appendChild(jarvisMsgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                // ใช้ v1beta คู่กับ gemini-1.5-flash เพื่อความเข้ากันได้สูงสุดกับ API Key ทุกประเภท
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${userApiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: "คุณคือ Jarvis ผู้ช่วยอัจฉริยะส่วนตัวของท่านประธาน จงตอบสั้น กระชับ เป็นกันเอง และพร้อมช่วยเหลือทุกภารกิจ: " + text }]
                        }]
                    })
                });

                const data = await response.json();
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    jarvisMsgDiv.textContent = data.candidates[0].content.parts[0].text;
                } else if (data.error) {
                    jarvisMsgDiv.textContent = "API Error: " + data.error.message;
                } else {
                    jarvisMsgDiv.textContent = "เกิดข้อผิดพลาดในการตอบสนองจากระบบ";
                }
            } catch (error) {
                jarvisMsgDiv.textContent = "เชื่อมต่อล้มเหลว: ตรวจสอบอินเทอร์เน็ตหรือ API Key ครับ";
            }

            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }
    </script>

</body>
</html>
