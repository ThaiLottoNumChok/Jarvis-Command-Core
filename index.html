<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jarvis STEM Robot Arm Control Center</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }
        body {
            background-color: #05050a;
            color: #00ffcc;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #login-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #05050a;
            z-index: 10;
        }
        .login-container {
            background: rgba(10, 15, 30, 0.9);
            border: 2px solid #00ffcc;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.4);
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        #chat-screen {
            display: none;
            flex-direction: column;
            height: 100%;
            width: 100%;
            overflow: hidden;
        }
        header {
            background: rgba(10, 15, 30, 0.95);
            border-bottom: 1px solid #00ffcc;
            padding: 12px;
            text-align: center;
            letter-spacing: 2px;
            font-weight: bold;
            text-shadow: 0 0 10px #00ffcc;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .factory-status {
            font-size: 10px;
            background: rgba(0, 255, 204, 0.2);
            border: 1px solid #00ffcc;
            color: #00ffcc;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .chat-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 85%;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.4;
            word-break: break-word;
            white-space: pre-wrap;
        }
        .jarvis-msg {
            background: rgba(0, 255, 204, 0.1);
            border: 1px solid #00ffcc;
            align-self: flex-start;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
        }
        .user-msg {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #ffffff;
            align-self: flex-end;
            color: #ffffff;
        }
        /* แผงควบคุมแขนกลและสไลเดอร์ */
        .robot-control-panel {
            background: rgba(0, 20, 40, 0.95);
            border-top: 1px solid #00ffcc;
            padding: 12px 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .robot-btn-group {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            align-items: center;
        }
        .robot-btn {
            background: rgba(0, 255, 204, 0.1);
            border: 1px solid #00ffcc;
            color: #00ffcc;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
        }
        .robot-btn:active {
            background: #00ffcc;
            color: #05050a;
        }
        .mic-btn {
            background: rgba(255, 0, 100, 0.2);
            border: 1px solid #ff3366;
            color: #ff3366;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
            font-weight: bold;
        }
        .mic-btn.listening {
            background: #ff3366;
            color: #fff;
            box-shadow: 0 0 10px #ff3366;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        .slider-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 11px;
        }
        .slider-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid #005544;
            padding: 6px 10px;
            border-radius: 4px;
        }
        .slider-box label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            color: #88ffcc;
        }
        .slider-box input[type=range] {
            width: 100%;
            accent-color: #00ffcc;
        }
        .input-area {
            display: flex;
            padding: 10px 15px;
            background: rgba(10, 15, 30, 0.98);
            border-top: 1px solid #00ffcc;
            width: 100%;
        }
        .input-area input {
            flex: 1;
            padding: 10px 12px;
            background: #000;
            border: 1px solid #00ffcc;
            color: #00ffcc;
            border-radius: 6px;
            outline: none;
            font-size: 16px;
        }
        .input-area button {
            margin-left: 10px;
            padding: 0 18px;
            background: #00ffcc;
            border: none;
            color: #05050a;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            letter-spacing: 1px;
            font-size: 14px;
        }
        h2 { margin-bottom: 15px; letter-spacing: 2px; text-shadow: 0 0 10px #00ffcc; }
        .input-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 6px; font-size: 13px; color: #88ffcc; }
        .login-container input { width: 100%; padding: 10px; background: #000; border: 1px solid #00ffcc; color: #00ffcc; border-radius: 6px; font-size: 14px; outline: none; }
        .login-container button { width: 100%; padding: 12px; background: #00ffcc; border: none; color: #05050a; font-weight: bold; font-size: 16px; border-radius: 6px; cursor: pointer; letter-spacing: 1px; margin-top: 10px; }
        .error-msg { margin-top: 10px; color: #ff3366; font-size: 13px; display: none; text-shadow: 0 0 5px #ff3366; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-container">
            <h2>JARVIS STEM CORE</h2>
            <div class="input-group">
                <label for="passcode">SECURITY PASSCODE:</label>
                <input type="password" id="passcode" value="44104545" placeholder="Enter Code">
            </div>
            <div class="input-group">
                <label for="apiKey">GEMINI API KEY:</label>
                <input type="password" id="apiKey" placeholder="วาง Google Gemini API Key ที่นี่">
            </div>
            <button onclick="checkAccess()">CONNECT CORE</button>
            <div id="error" class="error-msg">ACCESS DENIED: ตรวจสอบรหัสผ่านหรือ API Key อีกครั้ง</div>
        </div>
    </div>

    <div id="chat-screen">
        <header>
            <span>JARVIS ROBOT ARM LINK</span>
            <span id="bridgeStatus" class="factory-status">ONLINE</span>
        </header>

        <div class="chat-box" id="chatBox">
            <div class="message jarvis-msg">
                System Online. พร้อมรับคำสั่งเสียง ปุ่มลัด สไลเดอร์ และพูดคุยพัฒนาแขนกล LEGO STEM Kit แล้วครับท่านประธาน!
            </div>
        </div>

        <!-- แผงควบคุมแขนกลขั้นเทพ: ปุ่มลัด + สั่งด้วยเสียง + สไลเดอร์ปรับองศาละเอียด -->
        <div class="robot-control-panel">
            <div class="robot-btn-group">
                <button class="mic-btn" id="micBtn" onclick="toggleSpeechRecognition()">🎙️ สั่งด้วยเสียง</button>
                <button class="robot-btn" onclick="sendRobotCommand('HOME', 90)">🏠 Home</button>
                <button class="robot-btn" onclick="sendRobotCommand('PICK', 45)">👈 Pick</button>
                <button class="robot-btn" onclick="sendRobotCommand('PLACE', 135)">👉 Place</button>
                <button class="robot-btn" onclick="sendRobotCommand('STOP', 90)">🛑 E-STOP</button>
            </div>
            <div class="slider-container">
                <div class="slider-box">
                    <label><span>ฐาน (Base):</span> <span id="valBase">90°</span></label>
                    <input type="range" id="rangeBase" min="0" max="180" value="90" oninput="updateSlider('Base', this.value)">
                </div>
                <div class="slider-box">
                    <label><span>ข้อต่อ 1 (Arm 1):</span> <span id="valArm1">90°</span></label>
                    <input type="range" id="rangeArm1" min="0" max="180" value="90" oninput="updateSlider('Arm1', this.value)">
                </div>
                <div class="slider-box">
                    <label><span>ข้อต่อ 2 (Arm 2):</span> <span id="valArm2">90°</span></label>
                    <input type="range" id="rangeArm2" min="0" max="180" value="90" oninput="updateSlider('Arm2', this.value)">
                </div>
                <div class="slider-box">
                    <label><span>ที่หนีบ (Claw):</span> <span id="valClaw">90°</span></label>
                    <input type="range" id="rangeClaw" min="0" max="180" value="90" oninput="updateSlider('Claw', this.value)">
                </div>
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="พิมพ์คุยกับ Jarvis หรือสั่งงาน..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">SEND</button>
        </div>
    </div>

    <script>
        let userApiKey = "";
        let recognition = null;
        let isListening = false;

        function checkAccess() {
            const code = document.getElementById('passcode').value;
            const key = document.getElementById('apiKey').value.trim();
            
            if (code === '44104545' && key.length > 10) {
                userApiKey = key;
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('chat-screen').style.display = 'flex';
                initSpeechRecognition();
            } else {
                document.getElementById('error').style.display = 'block';
            }
        }

        // ระบบเสียง Speech Recognition
        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return;

            recognition = new SpeechRecognition();
            recognition.lang = 'th-TH';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onresult = function(event) {
                const speechText = event.results[0][0].transcript;
                document.getElementById('userInput').value = speechText;
                stopListeningEffect();
                
                if (speechText.includes('โฮม') || speechText.toLowerCase().includes('home')) {
                    sendRobotCommand('HOME', 90);
                } else if (speechText.includes('หยิบ') || speechText.toLowerCase().includes('pick')) {
                    sendRobotCommand('PICK', 45);
                } else if (speechText.includes('วาง') || speechText.toLowerCase().includes('place')) {
                    sendRobotCommand('PLACE', 135);
                } else if (speechText.includes('หยุด') || speechText.toLowerCase().includes('stop')) {
                    sendRobotCommand('STOP', 90);
                } else {
                    sendMessage();
                }
            };

            recognition.onerror = () => stopListeningEffect();
            recognition.onend = () => stopListeningEffect();
        }

        function toggleSpeechRecognition() {
            if (!recognition) {
                alert("เบราว์เซอร์นี้ไม่รองรับการสั่งงานด้วยเสียงครับ");
                return;
            }
            if (isListening) {
                recognition.stop();
                stopListeningEffect();
            } else {
                recognition.start();
                startListeningEffect();
            }
        }

        function startListeningEffect() {
            isListening = true;
            const micBtn = document.getElementById('micBtn');
            micBtn.classList.add('listening');
            micBtn.textContent = "🔴 กำลังฟัง...";
        }

        function stopListeningEffect() {
            isListening = false;
            const micBtn = document.getElementById('micBtn');
            micBtn.classList.remove('listening');
            micBtn.textContent = "🎙️ สั่งด้วยเสียง";
        }

        // ฟังก์ชันส่งคำสั่งปุ่มลัด
        function sendRobotCommand(action, value) {
            const chatBox = document.getElementById('chatBox');
            const msg = document.createElement('div');
            msg.className = 'message jarvis-msg';
            msg.textContent = `[คำสั่งแขนกล]: ส่งคำสั่ง ${action} (${value}°) ไปยังระบบควบคุมแล้วครับ! 🦾`;
            chatBox.appendChild(msg);
            chatBox.scrollTop = chatBox.scrollHeight;

            // ส่งผ่าน HTTP ไปยัง Python Bridge Server (ถ้าต่อใช้งานจริง)
            fetch('http://localhost:5000/api/command', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: action, value: value })
            }).catch(err => console.log("Bridge server offline (Simulation mode active)"));
        }

        // ฟังก์ชันควบคุมผ่านสไลเดอร์ปรับองศาละเอียด
        function updateSlider(axis, val) {
            document.getElementById('val' + axis).textContent = val + '°';
            
            // ส่งค่าองศาไปยัง Python Bridge / ESP32
            fetch('http://localhost:5000/api/command', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ axis: axis, angle: parseInt(val) })
            }).catch(err => console.log("Slider sync simulation mode"));
        }

        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const text = inputField.value.trim();
            if (!text) return;

            const chatBox = document.getElementById('chatBox');
            const userMsgDiv = document.createElement('div');
            userMsgDiv.className = 'message user-msg';
            userMsgDiv.textContent = text;
            chatBox.appendChild(userMsgDiv);

            inputField.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            const jarvisMsgDiv = document.createElement('div');
            jarvisMsgDiv.className = 'message jarvis-msg';
            jarvisMsgDiv.textContent = "กำลังประมวลผลคำสั่ง...";
            chatBox.appendChild(jarvisMsgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${userApiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: "คุณคือ Jarvis ผู้ช่วยอัจฉริยะส่วนตัวของท่านประธาน เชี่ยวชาญเรื่องแขนกลเลโก้และหุ่นยนต์ STEM ตอบสั้น กระชับ เป็นกันเอง: " + text }]
                        }]
                    })
                });

                const data = await response.json();
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    jarvisMsgDiv.textContent = data.candidates[0].content.parts[0].text;
                } else if (data.error) {
                    jarvisMsgDiv.textContent = "API Error: " + data.error.message;
                } else {
                    jarvisMsgDiv.textContent = "เกิดข้อผิดพลาดในการตอบสนองจากระบบ";
                }
            } catch (error) {
                jarvisMsgDiv.textContent = "เชื่อมต่อล้มเหลว: ตรวจสอบอินเทอร์เน็ตหรือ API Key ครับ";
            }

            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }
    </script>

</body>
</html>
